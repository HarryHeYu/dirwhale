name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  posix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Test
        run: python3 tests/run.py

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal binary
        run: make universal
      - name: Inspect
        run: |
          file dirwhale
          lipo -info dirwhale
          lipo -info dirwhale | grep -q 'x86_64'
          lipo -info dirwhale | grep -q 'arm64'
      - name: Test
        run: python3 tests/run.py
      - uses: actions/upload-artifact@v4
        with:
          name: dirwhale-darwin-universal
          path: dirwhale

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc make mingw-w64-x86_64-python
      - name: Build
        run: make
      - name: Test
        run: python tests/run.py
      - uses: actions/upload-artifact@v4
        with:
          name: dirwhale-windows-amd64
          path: dirwhale.exe
